services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      QUIZ_DB_PATH: /data/quiz.db
    volumes:
      - quizdata:/data
      - ./content:/srv/content
    # Optional: only needed for local testing on the host. Once the tunnel is
    # live you can delete this block so the app is reachable *only* via Cloudflare.
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      QUIZ_DB_PATH: /data/quiz.db
    volumes:
      - quizdata:/data
      - ./content:/srv/content
    command: ["python", "-m", "app.bot"]
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # The tunnel is created + configured in the Cloudflare dashboard; this only
    # needs the connector token. It reaches the web service as http://web:8000
    # over the internal compose network — TLS is terminated by Cloudflare's edge.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
volumes:
  quizdata:
