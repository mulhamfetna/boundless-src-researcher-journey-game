name: Bug report
description: Something in the app behaves incorrectly
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Mini App
        2. Start the journals station
        3. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / Telegram client
      placeholder: Android, Telegram Desktop, iOS ...
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console output
