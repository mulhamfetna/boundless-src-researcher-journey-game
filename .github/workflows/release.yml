name: Release

# SECURITY: `release: published` can only be triggered by a maintainer.
# A fork's pull request can NEVER reach the self-hosted runner from here.
# Pull-request code is tested only by ci.yml, on GitHub-hosted runners.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build and push image
    runs-on: ubuntu-latest          # GitHub-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to server
    needs: build
    runs-on: self-hosted            # the shared server; outbound connection only
    environment: production
    env:
      APP_IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
      DIR: /home/dev/mulham/src
      # Explicit -f disables Compose's automatic override loading, so the
      # override (which publishes 127.0.0.1:8000 for the smoke test) must be
      # named here too.
      COMPOSE_FILES: "-f docker-compose.prod.yml -f docker-compose.override.yml"
    steps:
      - name: Record the image being deployed
        run: |
          set -euo pipefail
          cd "$DIR"
          echo "$APP_IMAGE" > .image-next
          echo "deploying $APP_IMAGE"

      - name: Pull and start
        run: |
          set -euo pipefail
          cd "$DIR"
          docker compose $COMPOSE_FILES pull
          docker compose $COMPOSE_FILES up -d

      - name: Migrate schema (idempotent)
        run: |
          set -euo pipefail
          cd "$DIR"
          docker compose $COMPOSE_FILES exec -T web python -m app.migrate

      - name: Seed only changed content
        run: |
          set -euo pipefail
          cd "$DIR"
          docker compose $COMPOSE_FILES exec -T web python -c "
          import sys; sys.path.insert(0, '.')
          from app.db import connect, init_schema
          from app.seed import seed_changed
          c = connect('/data/quiz.db'); init_schema(c)
          print(seed_changed(c, '/srv/content/questions'))
          "

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/api/quizzes >/dev/null 2>&1; then
              echo "api ok"; break
            fi
            if [ "$i" = "15" ]; then echo "api never came up"; exit 1; fi
            sleep 2
          done
          curl -fsS -o /dev/null "http://127.0.0.1:8000/content/assets/art/map_bg.png"
          echo "assets ok"

      - name: Roll back on failure
        if: failure()
        run: |
          cd "$DIR"
          echo "::error::Deploy failed — restoring the previous image."
          if [ -f .image-current ]; then
            APP_IMAGE="$(cat .image-current)" \
              docker compose $COMPOSE_FILES up -d || true
            echo "restored $(cat .image-current)"
          else
            echo "no previous image recorded; stack left as-is for inspection"
          fi

      # Announce AFTER the smoke test, so nothing is announced that is not
      # actually live. Selective (minor/major, or [announce] in the notes),
      # deduplicated, and it can never fail the deploy — see app/announce_release.
      - name: Announce the release to players
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          cd "$DIR"
          docker compose $COMPOSE_FILES exec -T \
            -e RELEASE_TAG="$RELEASE_TAG" \
            -e RELEASE_TITLE="$RELEASE_TITLE" \
            -e RELEASE_NOTES="$RELEASE_NOTES" \
            web python -m app.announce_release || true

      - name: Record success
        run: |
          cd "$DIR"
          mv .image-next .image-current
          echo "deployed $(cat .image-current)"
