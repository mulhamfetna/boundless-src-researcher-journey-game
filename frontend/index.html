<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>مسابقة المجلات العلمية</title>
  <link rel="stylesheet" href="styles.css?v=3a1" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="app">
    <section id="screen-onboarding" class="screen hidden">
      <h1>رحلة الباحث</h1>
      <div id="ob-mentor"></div>
      <input id="ob-name" class="ob-name" placeholder="اكتب اسمك" />
      <div id="ob-avatars" class="ob-avatars"></div>
      <button id="ob-start" class="quiz-card">ابدأ الرحلة 🚀</button>
    </section>

    <section id="screen-home" class="screen">
      <h1>رحلة الباحث</h1>
      <div id="map-hud" class="map-hud"></div>
      <div id="map-path" class="map-path"></div>
      <div class="map-actions">
        <button id="btn-my-badges" class="quiz-card">🏅 أوسمتي</button>
        <button id="btn-my-progress" class="quiz-card">📊 تقدّمي</button>
      </div>
    </section>

    <section id="screen-runner" class="screen hidden">
      <div class="topbar">
        <span id="progress"></span>
      </div>
      <div id="boss-banner" class="hidden">👑 تحدّي الزعيم</div>
      <h2 id="q-prompt"></h2>
      <img id="q-image" class="q-image hidden" alt="" />
      <div id="q-options"></div>
      <button id="q-hint-btn" class="hint-btn">💡 تلميح</button>
      <div id="q-hint" class="hint-box hidden"></div>
      <div id="q-feedback" class="feedback-box"></div>
    </section>

    <section id="screen-funfact" class="screen hidden">
      <h2>💡 معلومة</h2>
      <div id="funfact-text"></div>
      <button id="funfact-continue">متابعة</button>
    </section>

    <section id="screen-report" class="screen hidden">
      <h2>نتيجتك</h2>
      <div id="report-summary"></div>
      <div id="report-items"></div>
      <div id="report-badges"></div>
      <button id="btn-board">عرض لوحة الصدارة</button>
    </section>

    <section id="screen-board" class="screen hidden">
      <h2>لوحة الصدارة</h2>
      <div class="board-toggle">
        <button id="board-quiz" class="quiz-card">هذه المسابقة</button>
        <button id="board-overall" class="quiz-card">الإجمالي</button>
      </div>
      <ol id="board-list"></ol>
      <button id="btn-home">العودة</button>
    </section>

    <section id="screen-badges" class="screen hidden">
      <h2>أوسمتي</h2>
      <div id="badges-grid"></div>
      <button id="btn-badges-home">العودة</button>
    </section>

    <section id="screen-progress" class="screen hidden">
      <h2>تقدّمي 📊</h2>
      <div id="dash-stats" class="dash-stats"></div>
      <div id="dash-next" class="dash-next"></div>
      <h3>إتقان المفاهيم</h3>
      <div id="dash-mastery"></div>
      <h3>آخر المحاولات</h3>
      <ol id="dash-history" class="dash-history"></ol>
      <button id="btn-progress-home">العودة</button>
    </section>
  </main>
  <div id="fx-layer"></div>
  <script src="store.js?v=p2"></script>
  <script src="game.js?v=p2"></script>
  <script src="ui.js?v=p2"></script>
  <script src="app.js?v=3a1"></script>
</body>
</html>
